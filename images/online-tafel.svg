    <g fill="#0d1b2a"><circle cx="486" cy="82" r="5"/><circle cx="516" cy="82" r="5"/></g>
    <path d="M478 98a24 24 0 0 0 46 0" fill="none" stroke="#f0a202" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Kaffee -->
  <g>
    <path d="M60 300h44v34a18 18 0 0 1-18 18H78a18 18 0 0 1-18-18z" fill="#ffffff" stroke="#006699" stroke-width="3.5"/>
    <path d="M104 308h12a12 12 0 0 1 0 24h-12" fill="none" stroke="#006699" stroke-width="3.5"/>
    <path d="M68 300h28v10H68z" fill="#c47f00"/>
    <g stroke="#9db8c9" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M72 288c0-6 6-6 6-12M88 288c0-6 6-6 6-12"/>
    </g>
  </g>
